name: Actualizar precios CholloSúper
on:
  schedule:
    - cron: '20 10 * * *' # 10:20 UTC, diario
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtener precios abiertos
        run: python scripts/actualizar.py
      - name: Guardar actualización en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar precios de referencia CholloSúper'
            git push
          fi
